name: Build forecast and deploy

# The site is updated by hand. This workflow runs only when someone presses "Run workflow"
# on the Actions page (workflow_dispatch) or pushes a commit to main. There is no schedule:
# an automatic one was tried and GitHub started it once in roughly 35 scheduled times
# (DECISIONS D30), so it was removed rather than left in as a promise the site cannot keep.
on:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow cannot write to the repository. It reads the code, builds the site in the
# runner, and publishes it to GitHub Pages as a deployment artifact. It makes no commits,
# pushes, tags or branches: there is no step that does, and the token could not if there were.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Tests (pipeline)
        run: python -m pytest -q
      - name: Tests (browser grid code)
        run: node --test tests/js/*.test.mjs
      - name: Build data from the newest complete ECMWF run
        # --ensemble optional: if the ensemble files are late or fail their self-check, the
        # deterministic forecast is still published and the page says the probabilities are missing.
        run: python -m pipeline.run --out web/data --ensemble optional
      - name: Stamp script and style URLs with the commit
        # Browsers and the Pages CDN cache app.js / grid.js / style.css separately. Without
        # this, a visitor can get a new app.js with an old grid.js and a blank page.
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/g" web/index.html web/app.js
          ! grep -n "__BUILD__" web/index.html web/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
